name: Build main.js
on:
  push:
    paths:
      - 'src/**'
      - 'build.js'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node build.js
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add main.js
          git diff --staged --quiet || git commit -m "Auto-build main.js"
          git push